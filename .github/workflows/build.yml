name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424

      - name: Restore
        run: dotnet restore WhisperTray.sln

      - name: Verify formatting
        run: dotnet format WhisperTray.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build WhisperTray.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WhisperTray.sln --configuration Release --no-build --verbosity normal
